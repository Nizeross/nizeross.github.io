name: Blog quality

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify content and site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/hugo
          key: hugo-${{ runner.os }}-${{ hashFiles('toolchain.json') }}-${{ github.sha }}
          restore-keys: hugo-${{ runner.os }}-${{ hashFiles('toolchain.json') }}-
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install verified Hugo and audited math assets
        run: |
          python scripts/install_hugo.py
          python scripts/sync_vendor.py
      - name: Content and Markdown checks
        run: |
          python scripts/site.py check
          npm run lint
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -v
          npm run test:workflows
      - name: Dependency and source security
        run: |
          npm audit --audit-level=low
          python scripts/security_check.py
      - name: Build and check every local reference
        run: |
          python scripts/site.py build
          python scripts/check_site.py
      - name: Install browser
        run: npm run browsers -- --with-deps
      - name: Browser and accessibility tests
        run: npm run test:e2e
      - name: Preserve diagnostic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-reports
          path: |
            reports/
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Preserve tested site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-site
          path: .build/site/
          retention-days: 3
      - name: Summarize failures
        if: failure()
        run: echo 'Validation failed. Open the first failing step and download quality-reports. Production deployment was not started.' >> "$GITHUB_STEP_SUMMARY"
